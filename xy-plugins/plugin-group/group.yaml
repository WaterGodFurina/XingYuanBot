plugins:
  # 指令型：需要前缀
  auto-reply:
    enabled: false
    type: command
    prefix: ["#", "/"]
    keywords: ["回复", "自动回复"]
    entry: auto-reply.js

  # 指令型：不需要前缀（直接关键词匹配）
  weather:
    enabled: false
    type: command
    prefix: []
    keywords: ["天气", "预报"]
    entry: weather.js

  # 事件型：监听系统事件
  welcome:
    enabled: false
    type: event
    event_name: "notice.group.increase"
    entry: welcome.js